<rect x="232" y="680" width="280" height="43" rx="15" fill="#1E3951" stroke="#3A729B"/><circle cx="250" cy="701" r="8" fill="#71CEFF"/><text x="269" y="707" class="meta">B: 2 + 3 + 5 + 6 + 7 + 8</text>
