 <path d="M 292 205 C 320 165 354 151 392 157 M 421 155 C 464 158 502 185 506 217" fill="none" stroke="#6C7D97" stroke-width="3" opacity=".6"/>
 <rect x="377" y="176" width="42" height="108" rx="18" fill="#131D2C" stroke="#8EA5C4" stroke-width="3"/>
