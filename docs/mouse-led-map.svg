<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-label="Top view diagram of Bloody P93 mouse, eight RGB LEDs, beacon group A LEDs 1 and 4 versus group B LEDs 2,3,5,6,7,8">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39455B"/><stop offset=".52" stop-color="#222E45"/><stop offset="1" stop-color="#121B2E"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101B33"/><stop offset="1" stop-color="#0A1020"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
 <style>.heading{font:700 33px Arial,sans-serif;fill:#F3F7FF}.sub{font:18px Arial,sans-serif;fill:#9EAFC8}.num{font:700 17px Arial,sans-serif;fill:#101A2C}.label{font:16px Arial,sans-serif;fill:#E4EEFF}.meta{font:14px Arial,sans-serif;fill:#B4C5DE}.lineA{stroke:#F6CC4B;stroke-width:2.5;fill:none}.lineB{stroke:#77C8FF;stroke-width:2.5;fill:none}</style>
</defs>
<rect width="1000" height="740" fill="url(#bg)"/>
<text class="heading" x="50" y="66">TRUE MOUSE ART</text>
<text class="sub" x="52" y="97">Bloody P93 • 8 physical LEDs • top view / side-edge positions</text>
