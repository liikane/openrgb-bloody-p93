name: Build and test OpenRGB 1.1 plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Test ntfy and Windows event classification bridge
        shell: pwsh
        run: |
          python integrations/ntfy/test_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Notification bridge tests failed' }
      - name: Test Genesis Rhod 600 color and notification protocol (no USB writes)
        shell: pwsh
        run: |
          python integrations/rhod600/test_protocol.py
          if ($LASTEXITCODE -ne 0) { throw 'Rhod 600 tests failed' }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Test HID RGB packet encoder (no hardware access)
        shell: pwsh
        run: |
          cl.exe /nologo /std:c++17 /EHsc /W4 /WX /Od tests\P93ProtocolTest.cpp /Fe:P93ProtocolTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'C++ test compilation failed' }
          & .\P93ProtocolTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'HID protocol tests failed' }
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Fetch matching OpenRGB 1.1 headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch release_1.1 https://github.com/CalcProgrammer1/OpenRGB.git openrgb
          if ($LASTEXITCODE -ne 0) { throw 'OpenRGB 1.1 header download failed' }
      - name: Build plugin DLL
        shell: pwsh
        run: |
          $env:OPENRGB_SOURCE_DIR = Join-Path $PWD 'openrgb'
          qmake OpenRGBBloodyP93Plugin.pro
          if ($LASTEXITCODE -ne 0) { throw 'qmake failed' }
          nmake
          if ($LASTEXITCODE -ne 0) { throw 'nmake failed' }
          if (-not (Test-Path 'dist/OpenRGBBloodyP93Plugin.dll')) { throw 'DLL not found' }
      - name: Upload experimental DLL
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-Bloody-P93-Windows-x64
          path: dist/OpenRGBBloodyP93Plugin.dll
          if-no-files-found: error
